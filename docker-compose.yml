services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: jis_db
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpass"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/jis_db
      DB_USER: root
      DB_PASS: rootpass
      JWT_SECRET: yourjwtsecret
    depends_on:
      mysql:
        condition: service_healthy
    # NOTE: do not bind-mount the host backend folder to /app in the container
    # because it will hide the packaged jar copied into /app by the image build.
    # For development hot-reload, mount to a different path or use a separate
    # docker-compose.override.yml. The mount has been removed to allow the
    # packaged jar to be present at runtime.

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mysql_data: